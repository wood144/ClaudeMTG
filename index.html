<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTG Commander</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #c8a84b;
    --accent2: #7b4fa0;
    --red: #c0392b;
    --green: #27ae60;
    --text: #d4cfc4;
    --muted: #6b6880;
    --white: #f0ece4;
    --hand-bg: #0e0e16;
    --card-w: 63px;
    --card-h: 88px;
    --radius-card: 5px;
    --drop-highlight: rgba(200,168,75,0.15);
    --drop-border: var(--accent);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    font-size: 15px;
    height: 100vh;
    overflow: hidden;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(123,79,160,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(200,168,75,0.04) 0%, transparent 60%);
  }

  /* LAYOUT — Desktop optimized: opp-header | opp-field | mid-bar | my-field | my-hand | my-header */
  #app {
    display: grid;
    grid-template-rows: auto auto 1fr auto 1fr auto auto;
    grid-template-columns: 1fr 220px;
    height: 100vh;
    gap: 0;
  }

  #opp-header   { grid-column: 1; grid-row: 1; }
  #opp-hand-zone { grid-column: 1; grid-row: 2; }
  #opp-field    { grid-column: 1; grid-row: 3; }
  #mid-bar      { grid-column: 1; grid-row: 4; }
  #my-field     { grid-column: 1; grid-row: 5; }
  #my-hand-zone { grid-column: 1; grid-row: 6; }
  #my-header    { grid-column: 1; grid-row: 7; }
  #sidebar      { grid-column: 2; grid-row: 1 / 8; border-left: 1px solid var(--border); }

  /* PLAYER HEADERS */
  .player-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  #my-header { border-bottom: none; border-top: 1px solid var(--border); }

  .player-name {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--accent);
    flex: 1;
  }

  .life-display {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .life-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 22px; height: 22px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .life-btn:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .life-total {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--white);
    min-width: 40px;
    text-align: center;
  }
  .life-total.low { color: var(--red); }

  .cmd-dmg-btn {
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.04em;
    transition: all 0.15s;
  }
  .cmd-dmg-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  .zone-btn {
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-family: 'Crimson Pro', serif;
    transition: all 0.15s;
  }
  .zone-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* BATTLEFIELD — free-form canvas; cards are absolutely positioned */
  .battlefield {
    padding: 10px;
    overflow: hidden;
    min-height: 0;
    background: var(--bg);
    position: relative;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .battlefield > .card-slot  { position: absolute; }
  .battlefield > .card-stack { position: absolute; }
  .battlefield.drag-over {
    background: var(--drop-highlight);
    box-shadow: inset 0 0 0 2px var(--drop-border);
  }
  #opp-field {
    align-items: flex-start;
    border-bottom: none;
  }
  #opp-field .card-slot { transform: rotate(180deg); }

  .battlefield-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--border);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* MID BAR */
  #mid-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 6px 14px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .phase-display {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--accent);
  }

  .phase-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .phase-btn:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  .send-btn {
    background: linear-gradient(135deg, var(--accent2), #5a3478);
    border: 1px solid var(--accent2);
    color: var(--white);
    padding: 4px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }
  .send-btn:hover { opacity: 0.85; transform: translateY(-1px); }

  /* CARDS — shared card sizing */
  .card-slot, .hand-card, .opp-hand-card, .zone-card-thumb {
    flex-shrink: 0;
    width: var(--card-w);
    height: var(--card-h);
    border-radius: var(--radius-card);
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
    background: var(--surface2);
  }
  .card-slot {
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card-slot:hover {
    transform: translateY(-4px) scale(1.04);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 0 1px var(--accent);
    z-index: 10;
  }
  .card-slot.tapped {
    transform: rotate(15deg);
  }
  .card-slot.tapped:hover {
    transform: rotate(15deg) translateY(-4px) scale(1.04);
  }
  /* A: opp cards start at 180deg — tapped adds 15deg on top */
  #opp-field .card-slot.tapped {
    transform: rotate(195deg);
  }
  #opp-field .card-slot.tapped:hover {
    transform: rotate(195deg) translateY(-4px) scale(1.04);
  }
  /* C: counter container inside a 180deg-rotated slot — flip it back upright */
  #opp-field .card-slot .counters-container {
    transform: translate(-50%, -50%) rotate(180deg);
  }
  .card-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .card-name-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    text-align: center;
    padding: 4px;
    color: var(--muted);
    font-family: 'Cinzel', serif;
  }
  .card-slot .card-name-fallback { z-index: 0; }
  .counters-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    pointer-events: none;
  }
  .counters-badge {
    background: var(--accent);
    color: var(--bg);
    font-size: 8px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    border-radius: 3px;
    padding: 0 3px;
    line-height: 14px;
    white-space: nowrap;
  }
  .counters-badge.badge-pt-plus  { background: #2d7a2d; color: #fff; }
  .counters-badge.badge-pt-minus { background: #8b2020; color: #fff; }
  .counters-badge.badge-keyword  { background: #1a3d7a; color: #fff; }

  /* CARD STACKS — Equipment / Aura attachment piles */
  .card-stack {
    position: relative;
    flex-shrink: 0;
    width: 63px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card-stack:hover { transform: translateY(-4px) scale(1.04); z-index: 10; }
  .card-stack.tapped { transform: rotate(15deg); }
  .card-stack.tapped:hover { transform: rotate(15deg) translateY(-4px) scale(1.04); }
  .card-stack .card-slot {
    position: absolute;
    left: 0;
    width: 63px;
    height: 88px;
    transition: box-shadow 0.15s;
  }
  .card-stack .card-slot:hover { transform: none !important; box-shadow: none !important; }
  .card-stack .attached-slot { border-top: 2px solid var(--accent2); }
  #opp-field .card-stack { transform: rotate(180deg); }
  #opp-field .card-stack:hover { transform: rotate(180deg) translateY(-4px) scale(1.04); }
  #opp-field .card-stack.tapped { transform: rotate(195deg); }
  #opp-field .card-stack.tapped:hover { transform: rotate(195deg) translateY(-4px) scale(1.04); }
  #opp-field .card-stack .card-slot { transform: none; }

  /* HAND ZONES */
  #opp-hand-zone, #my-hand-zone {
    background: var(--hand-bg);
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 56px;
    overflow-x: auto;
    overflow-y: hidden;
    position: relative;
  }
  #opp-hand-zone { border-bottom: 1px solid var(--border); }
  #my-hand-zone  { border-top: 1px solid var(--border); }

  /* Shared thin scrollbars */
  #opp-hand-zone::-webkit-scrollbar,
  #my-hand-zone::-webkit-scrollbar,
  #deck-list::-webkit-scrollbar { width: 4px; height: 4px; }
  #opp-hand-zone::-webkit-scrollbar-track,
  #my-hand-zone::-webkit-scrollbar-track,
  #deck-list::-webkit-scrollbar-track { background: transparent; }
  #opp-hand-zone::-webkit-scrollbar-thumb,
  #my-hand-zone::-webkit-scrollbar-thumb,
  #deck-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .hand-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    flex-shrink: 0;
    writing-mode: horizontal-tb;
    user-select: none;
  }

  .hand-card {
    cursor: grab;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .hand-card:hover {
    transform: translateY(-12px) scale(1.08);
    box-shadow: 0 12px 32px rgba(0,0,0,0.7), 0 0 0 1px var(--accent);
    z-index: 10;
  }
  .hand-card.dragging {
    opacity: 0.4;
    transform: scale(0.95);
  }
  .hand-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .hand-card .card-name-fallback { pointer-events: none; }

  .hand-empty {
    color: var(--border);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    user-select: none;
  }

  .opp-hand-card {
    cursor: default;
  }
  .opp-hand-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .opp-hand-badge {
    position: absolute;
    bottom: 2px;
    right: 2px;
    z-index: 2;
    background: var(--accent2);
  }

  /* Drag ghost */
  .drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 500;
    width: var(--card-w);
    height: var(--card-h);
    border-radius: var(--radius-card);
    overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,0.8), 0 0 0 2px var(--accent);
    opacity: 0.92;
    transition: none;
  }
  .drag-ghost img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .drag-ghost .card-name-fallback { background: var(--surface2); }

  /* SIDEBAR */
  #sidebar {
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .dice-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .dice-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--accent);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    padding: 5px 0;
    cursor: pointer;
  }
  .dice-btn:hover {
    border-color: var(--accent);
    background: rgba(200,168,75,0.1);
  }
  .dice-result {
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 24px;
    color: var(--white);
    min-height: 30px;
  }

  .sidebar-section {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .cmd-damage-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .cmd-dmg-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px;
    text-align: center;
  }
  .cmd-dmg-box label {
    display: block;
    font-size: 9px;
    color: var(--muted);
    font-family: 'Cinzel', serif;
    letter-spacing: 0.05em;
    margin-bottom: 3px;
  }
  .cmd-dmg-box .cdval {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    color: var(--white);
  }
  .cmd-dmg-box .cdval.danger { color: var(--red); }
  .cmd-dmg-adj {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-top: 3px;
  }
  .cmd-dmg-adj button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 16px; height: 16px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .cmd-dmg-adj button:hover { background: var(--accent); color: var(--bg); }

  /* ZONES */
  .zone-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
  }
  .zone-label {
    font-size: 10px;
    font-family: 'Cinzel', serif;
    color: var(--muted);
    letter-spacing: 0.05em;
    width: 50px;
    flex-shrink: 0;
  }
  .zone-count {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 6px;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--white);
    cursor: pointer;
  }
  .zone-count:hover { border-color: var(--accent); }

  /* DECK MANAGER */
  #deck-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .deck-panel-title {
    padding: 10px 12px 6px;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  #deck-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
  }

  .deck-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }
  .deck-item:hover { background: var(--surface2); border-color: var(--border); }
  .deck-item.active { background: var(--surface2); border-color: var(--accent); }
  .deck-item-name {
    flex: 1;
    font-size: 12px;
    font-family: 'Cinzel', serif;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .deck-item-del {
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
    background: none;
    border: none;
    padding: 0 2px;
  }
  .deck-item:hover .deck-item-del { opacity: 1; }
  .deck-item-del:hover { color: var(--red); }

  .deck-actions {
    padding: 8px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .deck-action-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-align: left;
    transition: all 0.15s;
    width: 100%;
  }
  .deck-action-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* MODALS */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(3px);
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    width: 480px;
    max-width: 95vw;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }
  .modal h2 {
    font-family: 'Cinzel Decorative', serif;
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .modal textarea, .modal input[type=text] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    font-size: 13px;
    padding: 8px;
    width: 100%;
    resize: vertical;
  }
  .modal textarea { min-height: 200px; }
  .modal textarea:focus, .modal input[type=text]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .modal-btns {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  /* TOKEN PICKER */
  .token-picker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
    overflow-y: auto;
    max-height: 50vh;
  }
  .token-picker-item {
    cursor: pointer;
    border-radius: 5px;
    border: 1px solid var(--border);
    overflow: hidden;
    background: var(--surface2);
    transition: border-color 0.15s, transform 0.15s;
  }
  .token-picker-item:hover { border-color: var(--accent); transform: translateY(-2px); }
  .token-picker-item img { width: 100%; display: block; }
  .token-picker-label {
    font-size: 9px;
    font-family: 'Cinzel', serif;
    text-align: center;
    padding: 3px 2px;
    color: var(--muted);
  }
  .token-picker-noart {
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-family: 'Cinzel', serif;
    color: var(--muted);
    padding: 4px;
    text-align: center;
  }
  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 6px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.06em;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* CARD CONTEXT MENU */
  #ctx-menu {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
    z-index: 200;
    min-width: 160px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    display: none;
  }
  .ctx-item {
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.04em;
    transition: background 0.1s;
  }
  .ctx-item:hover { background: var(--surface2); color: var(--accent); }
  .ctx-item.danger:hover { color: var(--red); }
  .ctx-sep { height: 1px; background: var(--border); margin: 3px 0; }
  .ctx-label { padding: 3px 10px 1px; font-size: 9px; color: var(--muted); font-family: 'Cinzel', serif; letter-spacing: 0.06em; text-transform: uppercase; }

  /* ZONE VIEWER */
  .zone-viewer {
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px;
    align-content: flex-start;
  }
  .zone-card-thumb {
    cursor: pointer;
    transition: transform 0.15s;
  }
  .zone-card-thumb:hover { transform: scale(1.05); border-color: var(--accent); }
  .zone-card-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .zone-card-thumb .card-name-fallback { font-size: 8px; padding: 3px; }

  /* CARD PREVIEW */
  #card-preview {
    position: fixed;
    pointer-events: none;
    z-index: 300;
    display: none;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,0.8);
    width: 200px;
  }
  #card-preview img { width: 100%; display: block; }

  /* BOARD STATE OUTPUT */
  #board-output {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-family: 'Crimson Pro', serif;
    font-size: 12px;
    color: var(--text);
    white-space: pre-wrap;
    max-height: 300px;
    overflow-y: auto;
    flex: 1;
  }

  .turn-indicator {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .hidden { display: none !important; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--red); color: var(--red);
    padding: 10px 20px; border-radius: 6px; z-index: 400;
    font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.04em;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  }
  .toast.success { border-color: var(--green); color: var(--green); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(10px); } }
</style>
</head>
<body>

<div id="app">
  <!-- OPPONENT HEADER -->
  <div class="player-header" id="opp-header">
    <span class="player-name" id="opp-name">⚔ CLAUDE</span>
    <div style="display:flex;gap:6px;align-items:center;flex:1;">
      <span class="zone-btn" onclick="openZone('opp','hand')">Hand: <span id="opp-hand-count">0</span></span>
      <span class="zone-btn" onclick="openZone('opp','graveyard')">GY: <span id="opp-gy-count">0</span></span>
      <span class="zone-btn" onclick="openZone('opp','exile')">Exile: <span id="opp-exile-count">0</span></span>
      <span class="zone-btn" onclick="openZone('opp','library')">Lib: <span id="opp-lib-count">0</span></span>
      <span class="zone-btn" onclick="openZone('opp','command')">⚜ <span id="opp-cmd-name">—</span></span>
    </div>
    <div class="life-display">
      <button class="life-btn" onclick="adjustLife('opp',-1)">−</button>
      <span class="life-total" id="opp-life">40</span>
      <button class="life-btn" onclick="adjustLife('opp',1)">+</button>
    </div>
  </div>

  <!-- OPPONENT HAND STRIP -->
  <div id="opp-hand-zone">
    <span class="hand-label">OPP HAND</span>
    <span class="zone-btn" onclick="drawCard('opp')" title="Draw top card of opponent's library">Draw</span>
    <span class="hand-empty" id="opp-hand-empty-msg">No cards in hand</span>
  </div>

  <!-- OPPONENT BATTLEFIELD -->
  <div class="battlefield" id="opp-field">
    <div class="battlefield-empty">CLAUDE'S BATTLEFIELD</div>
  </div>

  <!-- MID BAR -->
  <div id="mid-bar">
    <span class="turn-indicator">Turn <span id="turn-num">1</span></span>
    <button class="phase-btn" onclick="prevPhase()">◀</button>
    <span class="phase-display" id="phase-label">UNTAP</span>
    <button class="phase-btn" onclick="nextPhase()">▶</button>
    <button class="phase-btn" onclick="nextTurn()">End Turn</button>
    <span style="font-family:'Cinzel',serif;font-size:9px;color:var(--muted);letter-spacing:0.05em;">First:</span>
    <button class="phase-btn" onclick="toggleGoingFirst()" id="going-first-label" title="Click to toggle who goes first (affects untap step)">YOU</button>
    <div style="flex:1"></div>
    <button class="send-btn" onclick="openBoardState()">📋 Send to Claude</button>
  </div>

  <!-- MY BATTLEFIELD -->
  <div class="battlefield" id="my-field">
    <div class="battlefield-empty">YOUR BATTLEFIELD — drag cards here from hand</div>
  </div>

  <!-- MY HAND — visible strip -->
  <div id="my-hand-zone">
    <span class="hand-label">HAND</span>
    <span class="zone-btn" onclick="drawCard('me')" title="Draw top card of library">Draw</span>
    <span class="hand-empty" id="hand-empty-msg">No cards in hand</span>
  </div>

  <!-- MY HEADER -->
  <div class="player-header" id="my-header">
    <div class="life-display">
      <button class="life-btn" onclick="adjustLife('me',-1)">−</button>
      <span class="life-total" id="me-life">40</span>
      <button class="life-btn" onclick="adjustLife('me',1)">+</button>
    </div>
    <div style="display:flex;gap:6px;align-items:center;flex:1;justify-content:flex-end;">
      <span class="zone-btn" onclick="openZone('me','graveyard')">GY: <span id="me-gy-count">0</span></span>
      <span class="zone-btn" onclick="openZone('me','exile')">Exile: <span id="me-exile-count">0</span></span>
      <span class="zone-btn" onclick="openZone('me','library')">Lib: <span id="me-lib-count">0</span></span>
      <span class="zone-btn" onclick="openZone('me','command')">⚜ <span id="me-cmd-name">—</span></span>
    </div>
    <span class="player-name" style="text-align:right;" id="me-name">YOU ⚔</span>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Commander Damage</div>
      <div class="cmd-damage-grid">
        <div class="cmd-dmg-box">
          <label>You → Claude</label>
          <div class="cdval" id="cd-me-to-opp">0</div>
          <div class="cmd-dmg-adj">
            <button onclick="adjustCmdDmg('me-to-opp',-1)">−</button>
            <button onclick="adjustCmdDmg('me-to-opp',1)">+</button>
          </div>
        </div>
        <div class="cmd-dmg-box">
          <label>Claude → You</label>
          <div class="cdval" id="cd-opp-to-me">0</div>
          <div class="cmd-dmg-adj">
            <button onclick="adjustCmdDmg('opp-to-me',-1)">−</button>
            <button onclick="adjustCmdDmg('opp-to-me',1)">+</button>
          </div>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Tokens / Extras</div>
      <div style="display:flex;gap:6px;">
        <button class="deck-action-btn" onclick="addToken('me')">+ Token (Me)</button>
        <button class="deck-action-btn" onclick="addToken('opp')">+ Token (Opp)</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Dice Roller</div>
      <div class="dice-grid">
        <button class="dice-btn" onclick="rollDice(4)">d4</button>
        <button class="dice-btn" onclick="rollDice(6)">d6</button>
        <button class="dice-btn" onclick="rollDice(8)">d8</button>
        <button class="dice-btn" onclick="rollDice(10)">d10</button>
        <button class="dice-btn" onclick="rollDice(12)">d12</button>
        <button class="dice-btn" onclick="rollDice(20)">d20</button>
      </div>
      <div id="dice-result" class="dice-result"></div>
    </div>

    <div id="deck-panel">
      <div class="deck-panel-title">⚜ Decks</div>
      <div id="deck-list"></div>
      <div class="deck-actions">
        <button class="deck-action-btn" onclick="openImportMoxfield()">🔗 Import Moxfield Link</button>
        <button class="deck-action-btn" onclick="openPasteDecklist()">📋 Paste Decklist</button>
        <button class="deck-action-btn" onclick="loadDeckForPlayer('me')">▶ Load as My Deck</button>
        <button class="deck-action-btn" onclick="loadDeckForPlayer('opp')">▶ Load as Claude's Deck</button>
        <button class="deck-action-btn" onclick="exportDecks()" title="Download decks.json to save in assets/ folder">💾 Export Decks to File</button>
      </div>
    </div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div id="ctx-menu"></div>

<!-- CARD PREVIEW -->
<div id="card-preview"><img id="card-preview-img" src="" alt=""></div>

<!-- MODALS (injected dynamically) -->
<div id="modal-container"></div>

<script src="js/state.js"></script>
<script src="js/scryfall.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
